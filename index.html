<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DFO Guides</title>
<meta property="og:title" content="DFO Guides">
<meta property="og:description" content="Community-written Dungeon Fighter Online guides: boss patterns, mechanics, and clips written up by players, for players.">
<meta property="og:image" content="https://dfoguides.com/images/landing-banner.jpg">
<meta property="og:url" content="https://dfoguides.com/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#C9A15A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #ECE9E2;
    --muted: #A79E8C;
    --gold: #C9A15A;
    --gold-dim: #8A7442;
    --scrim: rgba(8, 9, 11, 0.72);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0E1013;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
  }
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    background-image:
      linear-gradient(180deg, rgba(10,11,13,0.55) 0%, rgba(10,11,13,0.35) 30%, rgba(10,11,13,0.88) 78%, #0a0b0d 100%),
      var(--bg-photo);
    background-size: cover;
    background-position: center 30%;
  }
  .hero-content {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px 96px;
    text-align: center;
  }
  .kicker {
    font-size: 0.78rem;
    letter-spacing: 0.14em;
    color: var(--gold);
    margin-bottom: 18px;
    font-weight: 500;
  }
  h1 {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: clamp(2.4rem, 6vw, 4rem);
    line-height: 1.08;
    margin: 0 0 22px;
    color: var(--ink);
    text-shadow: 0 2px 24px rgba(0,0,0,0.5);
  }
  .lede {
    font-size: 1.05rem;
    line-height: 1.65;
    color: var(--muted);
    margin: 0 auto 40px;
    max-width: 540px;
  }
  .guide-link {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 16px 30px;
    border: 1px solid var(--gold-dim);
    background: rgba(201, 161, 90, 0.08);
    color: var(--ink);
    text-decoration: none;
    font-size: 0.98rem;
    font-weight: 500;
    border-radius: 3px;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .guide-link:hover {
    border-color: var(--gold);
    background: rgba(201, 161, 90, 0.16);
  }
  .guide-link .tag {
    font-size: 0.72rem;
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    padding: 2px 8px;
    border-radius: 2px;
    letter-spacing: 0.04em;
  }
  .entries {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 36px 56px;
    text-align: left;
  }
  .entry { flex: 1 1 250px; max-width: 320px; }
  .entry-label {
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 500;
    margin: 0 0 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(201, 161, 90, 0.28);
  }
  .entry .guide-link { display: flex; justify-content: space-between; width: 100%; }
  .guide-link svg { width: 18px; height: 18px; flex: none; color: var(--gold); }
  .menu-tab {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 20;
    padding: 9px 18px;
    background: var(--scrim);
    color: var(--ink);
    border: 1px solid var(--gold-dim);
    border-radius: 3px;
    font: inherit;
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  .menu-tab:hover { border-color: var(--gold); }
  .menu-backdrop {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: rgba(0, 0, 0, 0.55);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s;
  }
  .menu-panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 40;
    width: min(320px, 88vw);
    padding: 26px 26px 32px;
    background: #0a0b0d;
    border-left: 1px solid var(--gold-dim);
    transform: translateX(100%);
    visibility: hidden;
    transition: transform 0.25s ease, visibility 0.25s;
    overflow-y: auto;
  }
  body.menu-open .menu-backdrop { opacity: 1; visibility: visible; }
  body.menu-open .menu-panel { transform: none; visibility: visible; }
  .menu-close {
    display: block;
    margin: 0 0 22px auto;
    background: none;
    border: 1px solid var(--gold-dim);
    color: var(--muted);
    border-radius: 3px;
    padding: 6px 14px;
    font: inherit;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .menu-close:hover { color: var(--ink); border-color: var(--gold); }
  .menu-panel section + section { margin-top: 30px; }
  .menu-panel a {
    display: block;
    padding: 11px 4px;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    font-size: 0.95rem;
  }
  .menu-panel a:hover { color: var(--gold); }
  .menu-panel a small { color: var(--muted); margin-left: 8px; font-size: 0.75rem; }
  footer {
    background: #0a0b0d;
    padding: 22px 24px 28px;
    text-align: center;
    font-size: 0.8rem;
    color: #5c574c;
  }
  @media (max-width: 520px) {
    .hero-content { padding-bottom: 64px; }
  }
</style>
</head>
<body>
  <div class="hero">
    <div class="hero-content">
      <div class="kicker">Work in progress</div>
      <h1>Community Written<br>Guides for DFO</h1>
      <div class="entries">
        <section class="entry">
          <h2 class="entry-label">Guides</h2>
          <a class="guide-link" href="legion/apocalypse/">
            <span>Apocalypse</span>
            <span class="tag">Legion dungeon</span>
          </a>
        </section>
        <section class="entry">
          <h2 class="entry-label">Statistics</h2>
          <a class="guide-link" href="stats/">
            <span>Class Statistics</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
          </a>
        </section>
      </div>
    </div>
  </div>

  <button class="menu-tab" id="menu-tab" type="button" aria-expanded="false" aria-controls="menu-panel">Menu</button>
  <div class="menu-backdrop" id="menu-backdrop"></div>
  <nav class="menu-panel" id="menu-panel" aria-label="Site menu">
    <button class="menu-close" id="menu-close" type="button">Close</button>
    <section>
      <h2 class="entry-label">Guides</h2>
      <a href="legion/apocalypse/">Apocalypse<small>Legion dungeon</small></a>
    </section>
    <section>
      <h2 class="entry-label">Statistics</h2>
      <a href="stats/">Class Statistics</a>
    </section>
  </nav>
  <footer>dfoguides.com &middot; not affiliated with Neople or Nexon</footer>
  <script>
    // Add new filenames here any time to grow the rotation, no other changes needed.
    const backgrounds = [
      'images/landing-banner.jpg',
      'images/landing-banner-2.jpg',
      'images/landing-banner-3.jpg',
      'images/landing-banner-4.jpg',
      'images/landing-banner-5.jpg',
      'images/landing-banner-6.jpg'
    ];
    const pick = backgrounds[Math.floor(Math.random() * backgrounds.length)];
    document.documentElement.style.setProperty('--bg-photo', `url('${pick}')`);

    // Side menu: opens from the Menu tab, closes on Close, the backdrop or Escape.
    const menuTab = document.getElementById('menu-tab');
    const setMenu = (open) => {
      document.body.classList.toggle('menu-open', open);
      menuTab.setAttribute('aria-expanded', String(open));
    };
    menuTab.addEventListener('click', () => setMenu(true));
    document.getElementById('menu-close').addEventListener('click', () => setMenu(false));
    document.getElementById('menu-backdrop').addEventListener('click', () => setMenu(false));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });
  </script>
</body>
</html>
